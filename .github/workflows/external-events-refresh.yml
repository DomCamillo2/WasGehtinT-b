name: External Events Sync

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-events-sync
  cancel-in-progress: false

jobs:
  # Full source set via production Next scrapers (uni, sudhaus, club-voltaire, dai, …).
  refresh-via-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Refresh external events cache
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          set -euo pipefail
          BASE_URL="${APP_BASE_URL:-https://www.wasgehttueb.app}"
          BASE_URL="${BASE_URL%/}"
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET secret is required"
            exit 1
          fi
          curl -fsS -X POST "${BASE_URL}/api/external-events/refresh" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json"

  # Offline fallback worker (subset of sources) if API refresh is unavailable.
  sync-worker-fallback:
    if: ${{ failure() }}
    needs: refresh-via-api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run external events worker fallback
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets['NEXT_PUBLIC_SUPABASE_URL'] }}
          SUPABASE_SECRET_KEY: ${{ secrets['SUPABASE_SECRET_KEY'] }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets['SUPABASE_SERVICE_ROLE_KEY'] }}
          DIGINIGHTS_URLS: ${{ secrets['DIGINIGHTS_URLS'] }}
          CLUBHAUS_EVENTS_URL: ${{ secrets['CLUBHAUS_EVENTS_URL'] }}
          EXTERNAL_EVENTS_REDDIT_SUBREDDITS: ${{ secrets['EXTERNAL_EVENTS_REDDIT_SUBREDDITS'] }}
        run: npm run external-events:sync:ci

  instagram-scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Scrape Instagram venues
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          set -euo pipefail
          BASE_URL="${APP_BASE_URL:-https://www.wasgehttueb.app}"
          BASE_URL="${BASE_URL%/}"
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET secret is required"
            exit 1
          fi
          curl -fsS -X POST "${BASE_URL}/api/cron/scrape" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json"
